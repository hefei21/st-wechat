# ========================================
#  ST WeChat Bot - 配置文件
# ========================================
# 此插件自动读取酒馆的 settings.json 和 secrets.json，
# LLM 端点和密钥均自动获取。
#
# 以下为可选覆盖项，仅在自动检测失败时使用。

# LLM 提供商与端点覆盖
provider: deepseek
endpoint: https://api.deepseek.com

# 密钥默认按 provider 从 ST secrets.json 精确选择。
# 如果 DeepSeek 是通过 ST 的 Custom 接口保存密钥，可显式设为 custom。
# secretSource: custom

# DeepSeek V4：日常角色聊天优先 flash
model: deepseek-v4-flash

# 角色聊天默认关闭思考，降低延迟；需要时可改为 enabled
thinking: disabled

# 生成与上下文预算
temperature: 0.9
maxOutputTokens: 1200
maxContextTokens: 64000
# 无精确 tokenizer 时的保守估算：平均每个 token 对应的字符数。
# 中文角色扮演建议保持 3；调小会预留更多上下文安全余量。
charsPerToken: 3
# Bot 端单次 LLM 请求最长等待时间；超时后返回明确错误，不阻塞后续微信消息。
requestTimeoutMs: 90000

# 同一所有者等待处理的普通消息上限；只读状态命令不占用该队列
maxQueuedMessages: 20

# 浏览器端新增聊天内容推送到微信：off | notify | full
# notify：单条有界摘要；full：尽量完整但仍限制总量，超长内容显式截断并提示到酒馆查看。
syncMode: notify

# 世界书 token 上限；0 表示暂不单独限制，由总上下文预算控制
worldInfoBudgetTokens: 0

# ST 数据目录的相对路径（从插件目录出发）
# 默认值适用于标准 ST 目录结构，通常不需要修改
# 插件位置:   ST/plugins/st-wechat/
# 数据位置:   ST/data/default-user/
dataRoot: ../../data/default-user

